services:
  ros:
    build: .
    # Shared across all Robotbase projects: the image is a generic ROS 2 + Gazebo
    # environment (no project code baked in — the workspace is mounted), so
    # generated projects reuse it instead of each building a multi-GB image.
    image: robotbase-runtime:latest
    working_dir: /workspace
    volumes:
      - ./:/workspace
    environment:
      - LIBGL_ALWAYS_SOFTWARE=1
      - OGRE_RTT_MODE=Copy
    command: sleep infinity
    # The Foxglove bridge port (8765) is intentionally NOT published here: headless runs don't need
    # it, and a fixed host port collides when two projects (or a leftover container) run at once.
    # `robotbase launch/test --gui` layers compose.foxglove.yaml to publish it on demand.
