version: 1
name: stop-before-obstacle
description: >
  Confirm that the robot stops before colliding with a static box obstacle.
timeout_seconds: 30
setup:
  reset_world: true
  robot: {pose: {x: 0.0, y: 0.0, yaw: 0.0}}
  obstacles:
    - id: obstacle_1
      type: box
      pose: {x: 2.0, y: 0.0, z: 0.25}
      size: {x: 0.5, y: 1.0, z: 0.5}
actions:
  - {type: wait_for_topic, topic: /scan, timeout_seconds: 5}
  - {type: run_node, package: mobile_nav, executable: controller}
  - {type: wait, duration_seconds: 10}
assertions:
  - {type: no_contact}          # ground-truth collision check (bumper sensor)
  - {type: no_collision}        # LiDAR-proximity heuristic
  - {type: minimum_obstacle_distance, minimum_metres: 0.25}
  - {type: robot_stopped, linear_velocity_tolerance: 0.05, angular_velocity_tolerance: 0.05}
  - {type: required_topic_messages, topic: /scan, minimum_count: 5}
# Domain randomization: `robotbase test stop-before-obstacle --trials N` jitters the obstacle
# placement and start heading each trial and reports robustness — so a controller tuned to
# one exact box position doesn't look solved.
randomize:
  robot_pose: {x: 0.1, yaw: 0.05}
  obstacles: {x: 0.3, y: 0.3}
