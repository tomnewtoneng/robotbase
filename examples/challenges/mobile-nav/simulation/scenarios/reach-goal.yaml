version: 1
name: reach-goal
description: >
  Drive the robot to the goal marker at (2, 1.5). The goal is off-axis, so the robot
  must turn toward it and stop near it — driving straight forward will miss. There is no
  obstacle between start and goal, but the arena has bounding walls: overshooting into one
  registers as a contact, so the controller must stop at the goal, not just pass through it.
timeout_seconds: 30
setup:
  reset_world: true
  robot: {pose: {x: 0.0, y: 0.0, yaw: 0.0}}
actions:
  - {type: wait_for_topic, topic: /odom, timeout_seconds: 5}
  - {type: run_node, package: mobile_nav, executable: controller}
  - {type: wait, duration_seconds: 15}
assertions:
  - {type: robot_reached_pose, target_x: 2.0, target_y: 1.5, position_tolerance_metres: 0.35}
  - {type: no_contact}
# Domain randomization: `robotbase test reach-goal --trials N` jitters the start pose each
# trial and reports robustness — so a controller hard-coded to one exact start-to-goal
# heading doesn't look solved. No obstacles here, so only the robot pose is randomized; the
# room extends to +/-4 m and the goal sits at (2.0, 1.5), well clear of these ranges.
randomize:
  robot_pose: {x: 0.2, y: 0.2, yaw: 0.1}
