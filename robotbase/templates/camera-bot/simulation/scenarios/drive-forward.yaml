version: 1
name: drive-forward
description: >
  Drive forward at least one metre with odometry and the LiDAR available. The starter
  controller drives straight forward; replace it to add your own (e.g. vision-based) behaviour.
timeout_seconds: 20
setup:
  reset_world: true
  robot: {pose: {x: 0.0, y: 0.0, yaw: 0.0}}
actions:
  - {type: wait_for_topic, topic: /odom, timeout_seconds: 5}
  - {type: run_node, package: warehouse_bot, executable: controller}
  - {type: wait, duration_seconds: 6}
assertions:
  - {type: robot_moved_minimum_distance, minimum_distance_metres: 1.0}
  - {type: required_topic_messages, topic: /scan, minimum_count: 5}
