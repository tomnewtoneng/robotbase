version: 1
name: turn-around
description: >
  A wall blocks the direct path to the goal at (3, 0). Drive around it (either side) and
  reach the goal without hitting the wall. Going straight will collide; the goal is only
  reachable via a detour, so the travelled path is longer than the straight-line distance.
  Combine obstacle sensing (/scan) with goal-seeking (/odom).
timeout_seconds: 45
setup:
  reset_world: true
  robot: {pose: {x: 0.0, y: 0.0, yaw: 0.0}}
  obstacles:
    - id: wall_1
      type: box
      pose: {x: 1.5, y: 0.0, z: 0.3}
      size: {x: 0.3, y: 1.6, z: 0.6}
actions:
  - {type: wait_for_topic, topic: /odom, timeout_seconds: 5}
  - {type: run_node, package: warehouse_bot, executable: controller}
  - {type: wait, duration_seconds: 30}
assertions:
  - {type: robot_reached_pose, target_x: 3.0, target_y: 0.0, position_tolerance_metres: 0.4}
  - {type: no_contact}
  - {type: minimum_path_length, minimum_metres: 3.5}
# Domain randomization: `robotbase test turn-around --trials N` jitters the wall placement
# and start heading each trial and reports robustness — so a controller that only clears one
# exact wall position doesn't look solved. The wall's y half-extent is 0.8 m, so even at the
# extremes of this jitter (wall centre y in [-0.3, 0.3]) both detours still leave ~2.9 m of
# clearance to the +/-4 m room walls, and the x jitter keeps it well between the start (x=0)
# and the goal (x=3.0).
randomize:
  robot_pose: {x: 0.1, yaw: 0.05}
  obstacles: {x: 0.3, y: 0.3}
