services:
  ros:
    # The shared runtime is a generic ROS 2 + Gazebo image (no project code baked in — the
    # workspace is mounted). `robotbase up` pulls the published image; `build: .` is the local
    # fallback (offline, or an unpublished dev build) from this project's Dockerfile.
    image: robotbase/robotbase-runtime:latest
    build: .
    working_dir: /workspace
    volumes:
      - ./:/workspace
    environment:
      - LIBGL_ALWAYS_SOFTWARE=1
      - OGRE_RTT_MODE=Copy
    command: sleep infinity
    # The Foxglove bridge port (8765) is intentionally NOT published here: headless runs don't need
    # it, and a fixed host port collides when two projects (or a leftover container) run at once.
    # `robotbase launch/test --gui` layers compose.foxglove.yaml to publish it on demand.
