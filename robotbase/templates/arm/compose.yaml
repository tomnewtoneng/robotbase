services:
  ros:
    build: .
    # Shared across all Robotbase projects: the image is a generic ROS 2 + Gazebo
    # environment (no project code baked in — the workspace is mounted), so
    # generated projects reuse it instead of each building a multi-GB image.
    image: robotbase-runtime:latest
    working_dir: /workspace
    volumes:
      - ./:/workspace
    environment:
      - LIBGL_ALWAYS_SOFTWARE=1
      - OGRE_RTT_MODE=Copy
    command: sleep infinity
    # Publish the optional Foxglove bridge port. (Host networking isn't used:
    # all ROS/Gazebo processes share one container, and Docker Desktop doesn't
    # expose host-networked ports to localhost anyway.)
    ports:
      - "8765:8765"
