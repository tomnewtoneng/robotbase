version: 1

project:
  name: warehouse-bot

runtime:
  ros_distribution: jazzy
  simulator: gazebo-harmonic
  architecture: amd64
  fixed_base: true              # a fixed-base arm — no mobile base pose to set
  ready_topics: ["/joint_states"]  # the sim is ready once joint states publish

workspace:
  path: /workspace
  source_directory: src
  build_command: colcon build --symlink-install
  install_dependencies: true

robot:
  template: arm
  name: warehouse_bot
  namespace: ""

joints:
  shoulder:
    joint: shoulder_joint
    command_topic: /shoulder_cmd
  elbow:
    joint: elbow_joint
    command_topic: /elbow_cmd
  state_topic: /joint_states

launch:
  package: warehouse_bot_bringup
  file: simulation.launch.py

simulation:
  world: src/warehouse_bot_description/worlds/warehouse.sdf
  world_name: warehouse
  headless: true
  reset_service: /world/warehouse/control

recording:
  enabled: true      # record every scenario run to a portable .robotbase/runs/<id>/episode.mcap
  topics: []         # [] = all topics; or an allow-list
  exclude: []

scenarios:
  directory: simulation/scenarios

agent:
  mcp:
    enabled: true
    port: 4381

visualisation:
  foxglove:
    enabled: false
    port: 8765
