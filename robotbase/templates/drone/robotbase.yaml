version: 1

project:
  name: warehouse-bot

runtime:
  ros_distribution: jazzy
  simulator: gazebo-harmonic
  architecture: amd64
  ready_topics: ["/odom"]          # the sim is ready once 3D odometry publishes

robot:
  template: drone
  name: warehouse_bot
  namespace: ""

sensors:
  imu:
    enabled: true
    topic: /imu
  odometry:
    enabled: true
    topic: /odom

control:
  velocity_topic: /cmd_vel          # 3D Twist: linear x/y/z, angular z

launch:
  package: warehouse_bot_bringup
  file: simulation.launch.py

simulation:
  world: src/warehouse_bot_description/worlds/warehouse.sdf
  world_name: warehouse
  headless: true
  reset_service: /world/warehouse/control

recording:
  enabled: true
  topics: []
  exclude: []

scenarios:
  directory: simulation/scenarios

agent:
  mcp:
    enabled: true
    port: 4381

visualisation:
  foxglove:
    enabled: false
    port: 8765
