version: 1
name: robot
base: differential-drive
# Extra parts compose onto the base: a mast link raised above the chassis. The lidar mounts
# on the mast (elevated), so it clears the low barrier but still sees the tall box.
parts:
  - links:
      - {name: mast, shape: cylinder, size: [0.02, 0.5], mass: 0.1}
    joints:
      - {name: mast_joint, parent: base_link, child: mast, xyz: [0, 0, 0.3]}
sensors:
  - {type: lidar, on: mast}
