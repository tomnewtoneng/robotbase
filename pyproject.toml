[project]
name = "robotbase"
version = "0.1.0"
description = "The batteries-included developer-experience layer for agent-driven robotics."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "mcp>=1.2",
    "mcap>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
robotbase = "robotbase.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["robotbase*"]
exclude = ["robotbase.templates*"]

[tool.setuptools.package-data]
robotbase = ["templates/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
