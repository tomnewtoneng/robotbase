[project]
name = "robotbase-kit"
version = "0.1.0"
description = "The batteries-included developer-experience layer for agent-driven robotics."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Tom Newton", email = "tominator172@gmail.com" }]
keywords = ["robotics", "ros2", "gazebo", "simulation", "mcp", "agents", "declarative", "testing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "mcp>=1.2",
    "mcap>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
sim-mujoco = ["mujoco>=3.0"]                     # the MuJoCo backend (robotbase.sim.mujoco_arm)
sim-rl = ["mujoco>=3.0", "gymnasium>=1.0"]       # the RL/gym env (robotbase.sim.gym_env)
bench-agent = ["claude-agent-sdk>=0.2"]          # RealAgent (robotbase.robotbench.real_agent)

[project.scripts]
robotbase = "robotbase.cli:main"

[project.urls]
Homepage = "https://github.com/tomnewtoneng/robotbase"
Repository = "https://github.com/tomnewtoneng/robotbase"
Issues = "https://github.com/tomnewtoneng/robotbase/issues"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Template files ship verbatim via MANIFEST.in (graft). include-package-data is
# what pulls those data files — including dotfiles like .mcp.json that a
# package-data glob silently drops — into the wheel.
include-package-data = true

[tool.setuptools.packages.find]
include = ["robotbase*"]
exclude = ["robotbase.templates*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
