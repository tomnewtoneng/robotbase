[project]
name = "robotbase"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "mcp>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
robotbase = "robotbase.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["robotbase*"]
exclude = ["robotbase.template*"]

[tool.setuptools.package-data]
robotbase = ["template/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
